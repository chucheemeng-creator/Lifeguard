<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" width="1280" height="860" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="ah" markerWidth="5" markerHeight="5" viewBox="0 0 10 10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0f2a44"/></marker></defs>
<rect width="1280" height="860" fill="#f8fafc"/>
<svg x="40" y="28" width="72" height="72" viewBox="0 0 256 256"><defs><mask id="m112104"><rect width="256" height="256" fill="#fff"/><circle cx="112" cy="112" r="48" fill="#000"/></mask></defs><g mask="url(#m112104)"><circle cx="112" cy="112" r="104" fill="#fff"/><path d="M112 112 L72.2 15.9 A104 104 0 0 1 151.8 15.9 Z" fill="#e53935"/><path d="M112 112 L208.1 72.2 A104 104 0 0 1 208.1 151.8 Z" fill="#e53935"/><path d="M112 112 L151.8 208.1 A104 104 0 0 1 72.2 208.1 Z" fill="#e53935"/><path d="M112 112 L15.9 151.8 A104 104 0 0 1 15.9 72.2 Z" fill="#e53935"/><circle cx="112" cy="112" r="101.0" fill="none" stroke="#7f1d1d" stroke-width="6"/></g><circle cx="112" cy="112" r="48" fill="none" stroke="#7f1d1d" stroke-width="6"/><circle cx="196" cy="196" r="54" fill="#16a34a" stroke="#ffffff" stroke-width="8"/><polyline points="160,198 178,198 186,178 198,218 210,170 218,198 232,198" fill="none" stroke="#ffffff" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/></svg>
<text x="128" y="62" font-size="36" fill="#0f2a44" font-weight="700" text-anchor="start">Lifeguard</text>
<text x="128" y="92" font-size="18" fill="#475569" font-weight="400" text-anchor="start">A watchdog for MT4 and HaNodeClient: restarts them when they hang or crash, and alerts you on Telegram</text>
<rect x="40" y="130" width="360" height="44" rx="10" fill="#0f2a44"/>
<text x="220.0" y="159" font-size="20" fill="#fff" font-weight="700" text-anchor="middle">① What it watches</text>
<rect x="460" y="130" width="360" height="44" rx="10" fill="#0f2a44"/>
<text x="640.0" y="159" font-size="20" fill="#fff" font-weight="700" text-anchor="middle">② How it detects trouble</text>
<rect x="880" y="130" width="360" height="44" rx="10" fill="#0f2a44"/>
<text x="1060.0" y="159" font-size="20" fill="#fff" font-weight="700" text-anchor="middle">③ What it does</text>
<rect x="40" y="310" width="360" height="210" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="60" y="344" font-size="20" fill="#0f2a44" font-weight="700" text-anchor="start">MT4 terminals (one or more)</text>
<rect x="60" y="360" width="320" height="62" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
<text x="76" y="386" font-size="17" fill="#0f2a44" font-weight="700" text-anchor="start">Heartbeat2 EA</text>
<text x="76" y="410" font-size="15" fill="#475569" font-weight="400" text-anchor="start">Runs on a chart, sends a heartbeat signal</text>
<rect x="60" y="436" width="320" height="62" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
<text x="76" y="462" font-size="17" fill="#0f2a44" font-weight="700" text-anchor="start">MQL4\Logs files</text>
<text x="76" y="486" font-size="15" fill="#475569" font-weight="400" text-anchor="start">EA load failures are written here</text>
<rect x="40" y="190" width="360" height="110" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="60" y="224" font-size="20" fill="#0f2a44" font-weight="700" text-anchor="start">HaNodeClient (optional)</text>
<rect x="60" y="238" width="320" height="46" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
<text x="76" y="267" font-size="15" fill="#475569" font-weight="400" text-anchor="start">Sends a heartbeat signal</text>
<rect x="460" y="190" width="360" height="210" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="224" font-size="20" fill="#0f2a44" font-weight="700" text-anchor="start">Heartbeat timeout</text>
<text x="800" y="224" font-size="14" fill="#475569" font-weight="400" text-anchor="end">MT4 default: 10 s</text>
<text x="480" y="254" font-size="15" fill="#475569" font-weight="400" text-anchor="start">No heartbeat? Check the process:</text>
<rect x="480" y="270" width="320" height="34" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
<text x="494" y="293" font-size="16" fill="#0f2a44" font-weight="700" text-anchor="start">Process gone</text>
<text x="786" y="293" font-size="14" fill="#475569" font-weight="400" text-anchor="end">crashed or closed</text>
<rect x="480" y="312" width="320" height="34" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
<text x="494" y="335" font-size="16" fill="#0f2a44" font-weight="700" text-anchor="start">Not responding</text>
<text x="786" y="335" font-size="14" fill="#475569" font-weight="400" text-anchor="end">window frozen</text>
<rect x="480" y="354" width="320" height="34" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
<text x="494" y="377" font-size="16" fill="#0f2a44" font-weight="700" text-anchor="start">Responding, no heartbeat</text>
<text x="786" y="377" font-size="14" fill="#475569" font-weight="400" text-anchor="end">EA stalled</text>
<rect x="460" y="420" width="360" height="110" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="454" font-size="20" fill="#0f2a44" font-weight="700" text-anchor="start">Fatal message in the log</text>
<text x="480" y="482" font-size="15" fill="#475569" font-weight="400" text-anchor="start">e.g. Initialization failed,</text>
<text x="480" y="506" font-size="15" fill="#475569" font-weight="400" text-anchor="start">requires active MQL5 account</text>
<rect x="880" y="190" width="360" height="340" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="912" cy="230" r="15" fill="#e53935"/>
<text x="912" y="236" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text>
<text x="940" y="228" font-size="18" fill="#0f2a44" font-weight="700" text-anchor="start">Kill the old process</text>
<text x="940" y="252" font-size="15" fill="#475569" font-weight="400" text-anchor="start">Confirms it exited; retries once</text>
<line x1="912" y1="248" x2="912" y2="290" stroke="#cbd5e1" stroke-width="3"/>
<circle cx="912" cy="308" r="15" fill="#e53935"/>
<text x="912" y="314" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text>
<text x="940" y="306" font-size="18" fill="#0f2a44" font-weight="700" text-anchor="start">Turn AutoTrade off (optional)</text>
<text x="940" y="330" font-size="15" fill="#475569" font-weight="400" text-anchor="start">MT4 will not trade right after restart</text>
<line x1="912" y1="326" x2="912" y2="368" stroke="#cbd5e1" stroke-width="3"/>
<circle cx="912" cy="386" r="15" fill="#16a34a"/>
<text x="912" y="392" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text>
<text x="940" y="384" font-size="18" fill="#0f2a44" font-weight="700" text-anchor="start">Start it again</text>
<text x="940" y="408" font-size="15" fill="#475569" font-weight="400" text-anchor="start">Allows 30 s for it to load</text>
<line x1="912" y1="404" x2="912" y2="446" stroke="#cbd5e1" stroke-width="3"/>
<circle cx="912" cy="464" r="15" fill="#16a34a"/>
<text x="912" y="470" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">4</text>
<text x="940" y="462" font-size="18" fill="#0f2a44" font-weight="700" text-anchor="start">Telegram alerts</text>
<text x="940" y="486" font-size="15" fill="#475569" font-weight="400" text-anchor="start">Alert, hourly reminder, recovery</text>
<line x1="402" y1="245" x2="456" y2="245" stroke="#0f2a44" stroke-width="3" marker-end="url(#ah)"/>
<line x1="402" y1="391" x2="456" y2="340" stroke="#0f2a44" stroke-width="3" marker-end="url(#ah)"/>
<line x1="402" y1="475" x2="456" y2="475" stroke="#0f2a44" stroke-width="3" marker-end="url(#ah)"/>
<line x1="822" y1="295" x2="876" y2="330" stroke="#0f2a44" stroke-width="3" marker-end="url(#ah)"/>
<line x1="822" y1="475" x2="876" y2="390" stroke="#0f2a44" stroke-width="3" marker-end="url(#ah)"/>
<path d="M1060 532 V568 H220 V536" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 6"/>
<path d="M212 546 L220 532 L228 546 Z" fill="#16a34a"/>
<rect x="500" y="552" width="280" height="32" rx="16" fill="#f8fafc"/>
<text x="640" y="574" font-size="16" fill="#16a34a" font-weight="700" text-anchor="middle">Keeps watching after restart</text>
<text x="40" y="628" font-size="22" fill="#0f2a44" font-weight="700" text-anchor="start">Safeguards: it never restarts forever</text>
<rect x="40" y="648" width="285" height="130" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="40" y="648" width="8" height="130" rx="4" fill="#e53935"/>
<text x="64" y="684" font-size="18" fill="#0f2a44" font-weight="700" text-anchor="start">Restart does not help</text>
<text x="64" y="716" font-size="15" fill="#475569" font-weight="400" text-anchor="start">3 restarts in a row, no heartbeat:</text>
<text x="64" y="742" font-size="15" fill="#475569" font-weight="400" text-anchor="start">stops and sends a critical alert.</text>
<rect x="345" y="648" width="285" height="130" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="345" y="648" width="8" height="130" rx="4" fill="#e53935"/>
<text x="369" y="684" font-size="18" fill="#0f2a44" font-weight="700" text-anchor="start">Crash loop</text>
<text x="369" y="716" font-size="15" fill="#475569" font-weight="400" text-anchor="start">5 restarts within 30 minutes:</text>
<text x="369" y="742" font-size="15" fill="#475569" font-weight="400" text-anchor="start">pauses restarts and alerts you.</text>
<rect x="650" y="648" width="285" height="130" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="650" y="648" width="8" height="130" rx="4" fill="#16a34a"/>
<text x="674" y="684" font-size="18" fill="#0f2a44" font-weight="700" text-anchor="start">Reminders while down</text>
<text x="674" y="716" font-size="15" fill="#475569" font-weight="400" text-anchor="start">Reminds you every hour,</text>
<text x="674" y="742" font-size="15" fill="#475569" font-weight="400" text-anchor="start">and tells you when it has recovered.</text>
<rect x="955" y="648" width="285" height="130" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="955" y="648" width="8" height="130" rx="4" fill="#16a34a"/>
<text x="979" y="684" font-size="18" fill="#0f2a44" font-weight="700" text-anchor="start">Live configuration</text>
<text x="979" y="716" font-size="15" fill="#475569" font-weight="400" text-anchor="start">Edits to config.json are reloaded</text>
<text x="979" y="742" font-size="15" fill="#475569" font-weight="400" text-anchor="start">without restarting Lifeguard.</text>
<text x="40" y="822" font-size="15" fill="#475569" font-weight="400" text-anchor="start">All times and counts above are defaults and can be changed in config.json. The Telegram token lives in .env.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>